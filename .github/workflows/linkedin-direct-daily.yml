name: Direct LinkedIn — image at noon, reel at 7 PM
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/linkedin-direct-daily.yml"
      - "scripts/linkedin_media_publish.py"
      - "linkedin-direct-queue.json"
  schedule:
    - cron: "0 7 * * *"   # 12:00 Pakistan time — image
    - cron: "0 14 * * *"  # 19:00 Pakistan time — reel
  workflow_dispatch:
    inputs:
      slot:
        description: "Validation only — no manual publishing"
        type: choice
        required: true
        default: image
        options: [image, reel]
permissions:
  contents: write
  issues: write
concurrency:
  group: thetechnoz-direct-linkedin-posting
  cancel-in-progress: false
jobs:
  direct-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      LINKEDIN_DIRECT_ENABLED: ${{ vars.LINKEDIN_DIRECT_ENABLED }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate LinkedIn media publisher
        run: |
          python -m py_compile scripts/linkedin_media_publish.py
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("linkedin-direct-queue.json").read_text())
          assert isinstance(q["posts"],list)
          assert isinstance(json.loads(Path("linkedin-direct-log.json").read_text())["posts"],dict)
          print("LinkedIn media schedule validated")
          PY
      - name: Publish scheduled media, or validate manual run
        env:
          SLOT: ${{ github.event_name == 'schedule' && github.event.schedule == '0 7 * * *' && 'image' || github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && 'reel' || inputs.slot || 'image' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Manual/push execution is dry-run only"
            python scripts/linkedin_media_publish.py --slot "$SLOT" --dry-run
          else
            python scripts/linkedin_media_publish.py --slot "$SLOT"
          fi
      - name: Alert on scheduled failures
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY="$(TZ=Asia/Karachi date +%Y-%m-%d)"
          TITLE="Action required: LinkedIn media failed on $DAY"
          if ! gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            gh issue create --title "$TITLE" --body "LinkedIn image/reel failed. Check prepared assets, approval, OAuth and ledger before any manual retry: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

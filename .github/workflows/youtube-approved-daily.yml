name: Daily approved TheTechnoz YouTube Short
on:
  schedule:
    # Start after 18:00 PKT; off-minute recovery slots reduce missed cron risk.
    - cron: "7,17,37,47 13 * * *" # 18:07 / 18:17 / 18:37 / 18:47 PKT
    - cron: "7,27,47 14 * * *"    # 19:07 / 19:27 / 19:47 PKT
    - cron: "7,37 15 * * *"       # 20:07 / 20:37 PKT
    - cron: "7 16 * * *"          # 21:07 PKT recovery
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-approved-daily.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Verify connection only; manual runs never publish"
        required: true
        type: choice
        default: verify_connection
        options: [verify_connection]
permissions:
  contents: write
  issues: write
concurrency:
  group: thetechnoz-approved-youtube-publisher
  cancel-in-progress: false
jobs:
  publish-daily-short:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh publication ledger before planning
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify OAuth and exact authorized YouTube channel
        run: |
          python -m pip install google-api-python-client google-auth google-auth-httplib2
          python scripts/youtube_uploader.py --expected-channel-id UCIwmarXnoB7vvssN9OxEeDA
      - name: Choose due approved episode and detect duplicate claims
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os,sys,json
          from datetime import datetime,date,timedelta,timezone
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from short_episode_specs import episode
          from youtube_editorial import scheduled_topic
          now_pkt=datetime.now(timezone(timedelta(hours=5)))
          day=now_pkt.date()
          valid=date(2026,11,27)<=day<=date(2026,12,10)
          spec=episode(day) if valid else None
          doc=scheduled_topic(day) if valid else None
          ledger=json.loads(Path("youtube-publishing-log.json").read_text())
          if ledger.get("channel_id")!="UCIwmarXnoB7vvssN9OxEeDA":
              raise SystemExit("Channel mismatch in ledger")
          item=doc["id"] if doc else ""
          # Special workflow-file push also recovers a missed slot after 18:00 PKT.
          # Never auto-upload again after any attempted claim; verify Studio first.
          # A delayed schedule arriving before 18:00 must NOT publish or fail.
          # Off-minute later runs recover the same approved local-day episode.
          in_window=18<=now_pkt.hour<=23
          recovered_push=os.environ["EVENT"]=="push" and in_window
          due=(os.environ["EVENT"]=="schedule" or recovered_push) and in_window and bool(spec) and bool(doc) and item not in ledger.get("posts",{})
          print(f"Pakistan date: {day}; approved episode: {item or 'none'}; publish: {due}")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"due={str(due).lower()}\ndate={day}\nitem_id={item}\n")
          PY
      - name: Install Kokoro, FFmpeg and original animation renderer
        if: steps.plan.outputs.due == 'true'
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install Pillow numpy soundfile kokoro-onnx
          curl -fL --retry 3 -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -fL --retry 3 -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s kokoro-v1.0.onnx)" -gt 10000000
          test "$(stat -c%s voices-v1.0.bin)" -gt 1000000
      - name: Render reviewed video and validate soundtrack
        if: steps.plan.outputs.due == 'true'
        run: |
          set -euo pipefail
          python scripts/build_youtube_video.py --kind short --date "${{ steps.plan.outputs.date }}" --output /tmp/thetechnoz-youtube-video.mp4
          python scripts/validate_youtube_video.py --kind short --file /tmp/thetechnoz-youtube-video.mp4
      - name: Hold early preparation until the exact 18:00 PKT upload window
        if: steps.plan.outputs.due == 'true'
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          import time
          pkt=timezone(timedelta(hours=5))
          now=datetime.now(pkt)
          target=now.replace(hour=18, minute=0, second=0, microsecond=0)
          remaining=(target-now).total_seconds()
          if 0 < remaining <= 1200:
              print(f"Video ready early. Holding {remaining:.0f} seconds until 18:00 PKT.")
              time.sleep(remaining)
          elif remaining > 1200:
              raise SystemExit("Unexpected early start: refusing to publish before its window")
          else:
              print("Publishing window reached or passed; proceeding.")
          PY
      - name: Refresh duplicate claims before upload
        if: steps.plan.outputs.due == 'true'
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path("youtube-publishing-log.json").read_text())
          item="${{ steps.plan.outputs.item_id }}"
          if item in p.get("posts",{}):
              raise SystemExit("A separate run already claimed this Short; refusing duplicate upload")
          print("Upload slot not yet claimed; safe to proceed.")
          PY
      - name: Persist duplicate-safe claim before upload
        if: steps.plan.outputs.due == 'true'
        env:
          ITEM_ID: ${{ steps.plan.outputs.item_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import json,os
          p=Path("youtube-publishing-log.json")
          ledger=json.loads(p.read_text())
          item=os.environ["ITEM_ID"]
          if item in ledger.setdefault("posts",{}):
              raise SystemExit("Duplicate claim: upload aborted")
          ledger["posts"][item]={"status":"attempted","claimed_at":datetime.now(timezone.utc).isoformat(),"note":"Check Studio before any retry if outcome is uncertain"}
          p.write_text(json.dumps(ledger,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-publishing-log.json
          git commit -m "claim YouTube episode $ITEM_ID"
          git push origin HEAD:main
      - name: Public upload to verified channel
        if: steps.plan.outputs.due == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          meta=json.loads(Path("/tmp/thetechnoz-youtube-video.json").read_text())
          assert meta["kind"]=="short" and meta["title"] and meta["description"]
          cmd=["python","scripts/youtube_uploader.py","--upload","--file",meta["file"],"--title",meta["title"],"--description",meta["description"],"--expected-channel-id","UCIwmarXnoB7vvssN9OxEeDA","--privacy","public"]
          result=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          m=re.search(r"UPLOAD SUCCESS: https://www.youtube.com/watch\?v=([\w-]+)",result.stdout)
          if result.returncode or not m:
              raise SystemExit("Upload failed or uncertain. Inspect Studio, never automatically retry")
          Path("/tmp/youtube-confirmed-id").write_text(m.group(1))
          print("Verified URL: https://www.youtube.com/watch?v="+m.group(1))
          PY
      - name: Save verified YouTube video URL
        if: steps.plan.outputs.due == 'true' && success()
        env:
          ITEM_ID: ${{ steps.plan.outputs.item_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import json,os
          p=Path("youtube-publishing-log.json")
          ledger=json.loads(p.read_text())
          item=os.environ["ITEM_ID"]
          assert ledger["posts"][item]["status"]=="attempted"
          vid=Path("/tmp/youtube-confirmed-id").read_text().strip()
          ledger["posts"][item]={"status":"published","id":vid,"url":"https://www.youtube.com/watch?v="+vid,"published_at":datetime.now(timezone.utc).isoformat(),"channel_id":"UCIwmarXnoB7vvssN9OxEeDA"}
          p.write_text(json.dumps(ledger,indent=2)+"\n")
          PY
          git add youtube-publishing-log.json
          git commit -m "confirm YouTube episode $ITEM_ID"
          git push origin HEAD:main
      - name: Notify owner of failed YouTube publishing or uncertain upload
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY="$(TZ=Asia/Karachi date +%Y-%m-%d)"
          TITLE="Action required: YouTube Short upload failed on ${DAY}"
          if ! gh issue list --state all --limit 100 --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            gh issue create --title "$TITLE" --body "The TheTechnoz 18:00 PKT YouTube publisher failed. If the ledger says attempted, do NOT blindly retry: first verify YouTube Studio for an already uploaded video. Once confirmed, reconcile the log before re-trying. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

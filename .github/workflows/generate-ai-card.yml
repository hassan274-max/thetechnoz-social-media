name: Generate approved social graphic
on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_ai_card.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: social-graphic
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --user Pillow
      - name: Generate graphic
        run: python3 scripts/generate_ai_card.py
      - name: Commit graphic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ai-automation-20261126.png
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git commit -m "Add AI automation social graphic"
            git push
          fi

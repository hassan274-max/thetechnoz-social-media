name: Free Kokoro neural voice preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/free-kokoro-preview.yml"
      - "scripts/narrate_rag_v3.py"
permissions:
  contents: read
jobs:
  neural-voice-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free speech engine
        run: |
          python -m pip install kokoro-onnx soundfile
      - name: Download free Kokoro model and voice pack
        run: |
          curl --fail --location --retry 3 --output kokoro-v1.0.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
          curl --fail --location --retry 3 --output voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
          test "$(stat -c%s kokoro-v1.0.onnx)" -gt 10000000
          test "$(stat -c%s voices-v1.0.bin)" -gt 1000000
      - name: Synthesize five RAG narration scenes
        run: |
          mkdir -p preview
          python - <<'PY'
          import sys
          from pathlib import Path
          import soundfile as sf
          from kokoro_onnx import Kokoro
          sys.path.insert(0,"scripts")
          from narrate_rag_v3 import SCENES
          model=Kokoro("kokoro-v1.0.onnx","voices-v1.0.bin")
          for i,(_,__,text) in enumerate(SCENES):
              audio, rate=model.create(text, voice="am_adam", speed=1.0, lang="en-us")
              sf.write(str(Path("preview") / f"scene-{i+1}.wav"), audio, rate)
              print(f"Rendered voice scene {i+1}: {len(audio)/rate:.2f}s")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thetechnoz-free-natural-narration
          path: preview/*.wav
          retention-days: 3

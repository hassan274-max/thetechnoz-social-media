name: Prepare unique daily Meta image
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-daily.yml"
      - "scripts/prepare_daily.py"
      - "scripts/meta_uniqueness.py"
  schedule:
    # 09:00 PKT (04:00 UTC); prepare today's unique 11AM image
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      day_offset:
        description: "0 for today, 1 for tomorrow (recommended for testing)"
        required: true
        default: "1"
        type: choice
        options: ["1", "0"]
permissions:
  contents: write
  issues: write
concurrency:
  group: thetechnoz-content-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image renderer
        run: python3 -m pip install --user Pillow
      - name: Prepare original nonrepeating image and queue entry
        env:
          DAY_OFFSET: ${{ github.event_name == 'workflow_dispatch' && inputs.day_offset || (github.event_name == 'push' && '1' || '0') }}
        run: python3 scripts/prepare_daily.py --day-offset "$DAY_OFFSET"
      - name: Notify owner when fresh content cannot be prepared
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Action required: Meta content preparation stopped"
          if ! gh issue list --state open --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            gh issue create --title "$TITLE" --body "Automated Facebook/Instagram content preparation failed. The content generator now refuses to repeat past topics or creatives. Review the failed GitHub Actions run and add fresh, original topics before resuming. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
      - name: Commit prepared assets and queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ posts-queue.json
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git commit -m "chore: prepare daily AI and Amazon PL posts"
            git push
          else
            echo "No new content."
          fi

name: Validate all 14 animated YouTube Shorts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-all-shorts.yml"
      - "scripts/short_visual_stories.py"
      - "scripts/render_educational_short.py"
      - "scripts/short_episode_specs.py"
permissions:
  contents: read
jobs:
  preview-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare runner
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install Pillow numpy soundfile kokoro-onnx
      - name: Download open Kokoro narrator
        run: |
          curl -fL --retry 3 --output kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -fL --retry 3 --output voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s kokoro-v1.0.onnx)" -gt 10000000
          test "$(stat -c%s voices-v1.0.bin)" -gt 1000000
      - name: Check unique episode scripts and visual scene types
        run: |
          python - <<'PY'
          import sys
          from datetime import date,timedelta
          sys.path.insert(0,"scripts")
          from short_episode_specs import episode,SPECS
          assert len(SPECS)==14
          questions=set()
          categories=set()
          for idx in range(14):
              d=date(2026,11,27)+timedelta(days=idx)
              item=episode(d)
              assert item and len(item["scenes"])==3
              assert item["question"] not in questions, f"Duplicate question: {d}"
              questions.add(item["question"]);categories.add(item["category"])
              assert item["spoken_takeaway"] and item["closing_question"]
              for label,spoken,kind in item["scenes"]:
                  assert label and spoken and kind
              print(f"{idx+1:02d} {d} {item['category']}: {item['question']}")
          assert {"AI","Amazon"}.issubset(categories)
          PY
      - name: Render and validate every episode (stop on first error)
        run: |
          set -euo pipefail
          mkdir -p /tmp/youtube-batch
          for i in $(seq 0 13); do
            day=$(date -u -d "2026-11-27 +$i days" +%F)
            echo "::group::Episode $((i+1))/14: $day"
            python scripts/build_youtube_video.py --date "$day" --kind short --output "/tmp/youtube-batch/$day.mp4"
            python scripts/validate_youtube_video.py --file "/tmp/youtube-batch/$day.mp4" --kind short
            echo "::endgroup::"
          done
          echo "All 14 rendered and passed technical checks"
      - name: Upload 14 videos for human creative review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thetechnoz-14-shorts-private-review
          path: |
            /tmp/youtube-batch/*.mp4
            /tmp/youtube-batch/*.json
          if-no-files-found: warn
          retention-days: 3

name: Publish scheduled Facebook and Instagram posts
on:
  push:
    branches: [main]
    paths:
      - "posts-queue.json"
  schedule:
    # Due time remains 11:00 / 19:00 PKT; multiple off-minute dispatch attempts.
    - cron: "7,27,47 6 * * *"   # 11:07 / 11:27 / 11:47 PKT
    - cron: "7 7 * * *"         # 12:07 PKT backup
    - cron: "9,29,49 14 * * *"  # 19:09 / 19:29 / 19:49 PKT
    - cron: "9 15 * * *"        # 20:09 PKT backup
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not publish; validate due queue items"
        required: true
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: thetechnoz-meta-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish queued posts
        run: python3 scripts/publish_meta.py
      - name: Preserve confirmed platform IDs even if a different platform failed
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        run: |
          if [[ -n "$(git status --porcelain -- publishing-log.json assets-manifest.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publishing-log.json assets-manifest.json
            git commit -m "chore: record Meta publishing results"
            git push
          fi

name: Meta schedule watchdog and missed-post recovery
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/meta-watchdog.yml"
      - "scripts/meta_schedule_health.py"
  schedule:
    # PKT = UTC+05. Off-minute backup checks avoid top-of-hour GitHub congestion.
    # Image: independent checks at 11:13, 11:33, 11:53 and 12:13 PKT.
    - cron: "13,33,53 6 * * *"
    - cron: "13 7 * * *"
    # Reel: independent checks at 19:13, 19:33, 19:53 and 20:13 PKT.
    - cron: "13,33,53 14 * * *"
    - cron: "13 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: thetechnoz-meta-publishing
  cancel-in-progress: false
jobs:
  recover-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - name: Retry only unpublished due image posts
        id: image
        continue-on-error: true
        run: python3 scripts/publish_meta.py
      - name: Retry only unpublished due approved animated Reels
        id: reel
        continue-on-error: true
        run: python3 scripts/publish_reels.py
      - name: Persist each confirmed publication, even after partial platform failure
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- publishing-log.json assets-manifest.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publishing-log.json assets-manifest.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: record watchdog Meta recovery results"
              git push origin HEAD:main
            fi
          fi
      - name: Verify today’s due slots on both platforms
        id: verify
        continue-on-error: true
        run: python3 scripts/meta_schedule_health.py
      - name: Alert on pending, missing or failed publication without publishing repeats
        if: always() && (steps.image.outcome == 'failure' || steps.reel.outcome == 'failure' || steps.verify.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY="$(TZ=Asia/Karachi date +%Y-%m-%d)"
          TITLE="Action required: Meta publishing missed a slot on ${DAY}"
          if ! gh issue list --state all --limit 100 --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            gh issue create --title "$TITLE" --body "The automatic Meta watchdog detected a missing or failed Facebook/Instagram publication. The publisher attempted recovery and only retries items without a confirmed published ID. Check the run and the publishing ledger. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
      - name: Fail run if any published-state check remains unresolved
        if: steps.image.outcome == 'failure' || steps.reel.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: exit 1

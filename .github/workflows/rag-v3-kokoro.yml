name: Render RAG V3 with free natural Kokoro voice
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_rag_v3.py'
      - '.github/workflows/rag-v3-kokoro.yml'
permissions:
  contents: read
jobs:
  narrated-v3-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install narrator and media tools
        run: |
          python -m pip install kokoro-onnx soundfile Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download original open-weight voice model
        run: |
          curl -fL --retry 3 --output kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -fL --retry 3 --output voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s kokoro-v1.0.onnx)" -gt 10000000
          test "$(stat -c%s voices-v1.0.bin)" -gt 1000000
      - name: Render original full-frame RAG animation
        run: |
          python scripts/render_rag_v3.py --output /tmp/rag-v3.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 /tmp/rag-v3.mp4
      - name: Synthesize and mix scene-aligned natural voice
        run: |
          mkdir -p preview
          python scripts/narrate_rag_v3.py \
            --video /tmp/rag-v3.mp4 \
            --output preview/rag-v3-narrated.mp4 \
            --voice am_adam
          ffprobe -v error -show_entries stream=codec_type,codec_name:format=duration -of json preview/rag-v3-narrated.mp4
      - name: Save finished video for creative approval
        uses: actions/upload-artifact@v4
        with:
          name: rag-v3-kokoro-narrated-preview
          path: preview/rag-v3-narrated.mp4
          retention-days: 3
